name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Windows is not supported by the Rite language server at this time.

jobs:
  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npx @vscode/vsce package --no-dependencies --target darwin-arm64 darwin-x64 linux-x64 linux-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: vsix-packages
          path: "*.vsix"
