name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

jobs:
  validate:
    name: Validate version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Check tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [[ "${VERSION}" != "${PKG_VERSION}" ]]; then
            echo "Version mismatch: tag=${VERSION}, package.json=${PKG_VERSION}" >&2
            exit 1
          fi

  verify:
    name: Verify rite-ls provenance
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: ./.github/actions/verify-rite-ls

  publish:
    name: Publish (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: [validate, verify]
    strategy:
      # Serialised: the first target creates the marketplace version, the rest
      # attach their platform package to it. Parallel uploads race on that.
      max-parallel: 1
      fail-fast: true
      matrix:
        target: [darwin-arm64, darwin-x64, linux-x64, linux-arm64, win32-x64]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - name: Remove other platform binaries
        run: find bin -maxdepth 1 -mindepth 1 -type d ! -name "${{ matrix.target }}" -exec rm -rf {} +
      - name: Package
        run: npx @vscode/vsce package --no-dependencies --target ${{ matrix.target }}
      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx @vscode/vsce publish --packagePath *.vsix
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rite-${{ matrix.target }}
          path: "*.vsix"
          retention-days: 3

  release:
    name: Draft GitHub release
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Download packaged extensions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: vsix
          pattern: rite-*
          merge-multiple: true
      - name: Extract changelog section
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Print the body between this version's heading and the next "## " heading.
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { flag = 1; next }
            flag && /^## / { exit }
            flag { print }
          ' CHANGELOG.md | sed '/./,$!d' > notes.md
          if [[ ! -s notes.md ]]; then
            echo "No changelog section found for ${VERSION}" >&2
            exit 1
          fi
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --draft --title "${GITHUB_REF_NAME}" --notes-file notes.md vsix/*.vsix
